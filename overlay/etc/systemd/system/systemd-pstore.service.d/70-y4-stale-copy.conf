[Service]
# systemd-pstore writes the "current" console and dmesg copies under fixed
# names. A leftover copy from the previous boot makes the write fail with
# "File exists" on every boot after the first. Clear the stale copies first;
# the archived, timestamped entries are untouched.
ExecStartPre=-/usr/bin/rm -f /var/lib/systemd/pstore/dmesg.txt
ExecStartPre=-/usr/bin/rm -f /var/lib/systemd/pstore/console.txt
